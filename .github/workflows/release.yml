name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag to release (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests and syntax check
        run: |
          npm test
          npm run check

      - name: Determine version tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"

      - name: Create extension zip package
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          ARCHIVE_NAME="cookie-relay-${TAG}.zip"
          zip -r "${ARCHIVE_NAME}" \
            manifest.json \
            popup.html \
            popup.js \
            cookie-model.js \
            styles.css \
            icons/ \
            LICENSE \
            README.md
          echo "Created ${ARCHIVE_NAME}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          files: cookie-relay-*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
